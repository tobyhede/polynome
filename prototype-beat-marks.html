<!doctype html>
<!--
  PROTOTYPE — throwaway. Not linked from the app and not part of any build.

  Round two. Round one chose beat numbers and they shipped; in the grid they
  read as too busy. The question now is whether the mark can be quiet at rest
  and name itself only when it is being asked — a dot that becomes a number.

  What CSS can and cannot do here, since it decides the shape of every variant
  below:
    - A true shape morph, dot geometry into glyph geometry, is not possible.
      Glyphs are not paths CSS can interpolate.
    - `content` is not animatable, so a text swap is discrete. The number has
      to be present the whole time and revealed, not substituted.
    - What is possible: one box holding the number at `color: transparent`,
      with the dot drawn as a `box-shadow` on that same box. Transition the
      colour and the shadow's spread together and the dot resolves into the
      digit. `.beat-number` is already absolutely positioned, so nothing the
      growth does costs any layout.

  Five variants on `?variant=`, over the real stylesheet and the real
  renderer's own scraped markup, at a Subdivision of 2 and of 4.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prototype — beat marks</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      /* ---- prototype chrome, not part of any variant ---- */
      .proto-shell {
        display: grid;
        gap: 30px;
        max-width: 980px;
        margin: 0 auto;
        padding: 24px 20px 120px;
      }
      .proto-picker {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--line);
      }
      .proto-picker button {
        padding: 9px 14px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-family: var(--body-font);
        font-size: 0.78rem;
      }
      .proto-picker button[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent);
        color: #0c0c0d;
        font-weight: 700;
      }
      .proto-case > h2 {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .proto-note {
        margin: 0;
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.6;
      }
      .proto-note strong {
        color: var(--ink);
        font-weight: 640;
      }
      .proto-bar {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 8px 10px;
        border-radius: 999px;
        background: #e9e7e1;
        color: #0c0c0d;
        box-shadow: 0 8px 30px rgb(0 0 0 / 55%);
        font-size: 0.8rem;
        z-index: 10;
      }
      .proto-bar button {
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 50%;
        background: #0c0c0d;
        color: #e9e7e1;
        cursor: pointer;
      }
      .proto-bar span {
        min-width: 300px;
        text-align: center;
        font-weight: 640;
      }

      /* ---- shared by every dot variant ----------------------------------
         Two marks sharing one centre: the digit, held in the box at
         `color: transparent`, and a dot drawn by the box's own pseudo-element.
         Revealing the number fades the colour in while the dot fades out and
         blooms past it. The box keeps the digit's size throughout, so the row
         gap is sized once and nothing reflows when the state changes — which
         is the whole reason this can be a transition rather than a swap. */
      [data-variant="2"] .beat-number,
      [data-variant="3"] .beat-number,
      [data-variant="4"] .beat-number {
        color: transparent;
        transition: color 160ms ease;
      }
      [data-variant="2"] .beat-number::before,
      [data-variant="3"] .beat-number::before,
      [data-variant="4"] .beat-number::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        border-radius: 50%;
        background: var(--line-strong);
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }
      /* Tighter than the shipped numbers, because at rest the mark is 4px of
         ink rather than a 10px digit. The reveal grows into that space. */
      [data-variant="2"] .steps,
      [data-variant="3"] .steps,
      [data-variant="4"] .steps {
        row-gap: 20px;
        padding-bottom: 24px;
      }

      /* ============================================================
         VARIANT 2 — dot only. It never becomes anything.
         ============================================================ */

      /* ============================================================
         VARIANT 3 — dot, resolving on hover or keyboard focus anywhere in the
         grid. Quiet until looked at, and every beat answers together.
         `hover: hover` gates it: a touch screen has no hover to resolve on and
         would be left with variant 2 for good.
         ============================================================ */
      @media (hover: hover) {
        [data-variant="3"] .steps:hover .beat-number {
          color: var(--muted);
        }
        [data-variant="3"] .steps:hover .beat-number::before {
          opacity: 0;
          transform: scale(3);
        }
      }
      [data-variant="3"] .steps:focus-within .beat-number {
        color: var(--muted);
      }
      [data-variant="3"] .steps:focus-within .beat-number::before {
        opacity: 0;
        transform: scale(3);
      }

      /* ============================================================
         VARIANT 4 — dot, resolving on the beat that is playing. `:has()` reads
         the playhead class the visual playhead already writes onto a step, so
         this needs no JavaScript at all. Works on a touch screen, and answers
         "where am I in the bar" at the moment that is the question.
         ============================================================ */
      [data-variant="4"] .beat:has(.step.is-current) .beat-number {
        color: var(--accent);
      }
      [data-variant="4"] .beat:has(.step.is-current) .beat-number::before {
        opacity: 0;
        transform: scale(3);
      }
    </style>
  </head>
  <body>
    <div class="proto-shell app-shell" data-variant="0">
      <div class="proto-picker" id="proto-picker"></div>
      <p class="proto-note" id="proto-description"></p>

      <section class="proto-case">
        <h2>4/4 · subdivision 2 · one row</h2>
        <div class="cycle-list" id="case-2"></div>
      </section>

      <section class="proto-case">
        <h2>4/4 · subdivision 4 · wrapped</h2>
        <div class="cycle-list" id="case-4"></div>
      </section>
    </div>

    <div class="proto-bar">
      <button type="button" id="proto-prev" aria-label="Previous variant">←</button>
      <span id="proto-label"></span>
      <button type="button" id="proto-next" aria-label="Next variant">→</button>
    </div>

    <script type="module">
      const VARIANTS = [
        {
          name: "0 — no mark",
          note: "<strong>Before any of this.</strong> Even spacing and nothing else. Nothing says where a beat starts, and at a subdivision of 4, wrapped, you cannot work it out.",
        },
        {
          name: "1 — numbers, as shipped",
          note: "<strong>What is on the branch now.</strong> Every beat named, always. It answers the question, and it is the busiest thing in the card — sixteen circles and four numerals competing at one weight.",
        },
        {
          name: "2 — dot only",
          note: "<strong>The mark reduced to a point.</strong> Says a beat starts here and nothing else. Quietest of the five, and the only one with nothing to reveal — you never learn <em>which</em> beat, which is the thing a wrapped row costs you.",
        },
        {
          name: "3 — dot → number on hover",
          note: "<strong>Dots at rest, numbers when the grid is looked at.</strong> Hover or keyboard focus anywhere in the row resolves every dot at once. Gated on <code>hover: hover</code>, so a phone is left with variant 2 and never sees a number — which is where most of this app is used.",
        },
        {
          name: "4 — dot → number on the playing beat",
          note: "<strong>Dots at rest; the beat being played names itself.</strong> Pure CSS — <code>:has(.step.is-current)</code> reads the class the visual playhead already writes every frame. Works on touch, costs nothing while stopped, and answers 'where am I in the bar' at the moment that is the question.",
        },
      ];

      const markup = await fetch("./prototype-beat-marks.json").then((r) => r.json());

      for (const subdivision of ["2", "4"]) {
        const host = document.querySelector(`#case-${subdivision}`);
        host.innerHTML = markup[subdivision];
        const steps = host.querySelector(".steps");
        steps.style.setProperty("--beats-per-row", subdivision === "4" ? "2" : "4");
        // Stands in for a transport run, so variant 4 has a playhead to read.
        // The real class is written onto a step every animation frame.
        steps.querySelectorAll(".beat")[1]?.querySelector(".step")?.classList.add("is-current");
      }

      const shell = document.querySelector(".proto-shell");
      const label = document.querySelector("#proto-label");
      const description = document.querySelector("#proto-description");
      const picker = document.querySelector("#proto-picker");

      VARIANTS.forEach((variant, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = variant.name;
        button.dataset.variant = String(index);
        button.addEventListener("click", () => show(index));
        picker.append(button);
      });

      function show(index) {
        const next = (index + VARIANTS.length) % VARIANTS.length;
        shell.dataset.variant = String(next);
        label.textContent = VARIANTS[next].name;
        description.innerHTML = VARIANTS[next].note;
        for (const button of picker.children) {
          button.setAttribute("aria-pressed", String(Number(button.dataset.variant) === next));
        }
        const url = new URL(location.href);
        url.searchParams.set("variant", String(next));
        history.replaceState(null, "", url);
      }

      const current = () => Number(shell.dataset.variant);
      document.querySelector("#proto-prev").addEventListener("click", () => show(current() - 1));
      document.querySelector("#proto-next").addEventListener("click", () => show(current() + 1));
      document.addEventListener("keydown", (event) => {
        if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
        if (event.key === "ArrowLeft") show(current() - 1);
        if (event.key === "ArrowRight") show(current() + 1);
      });

      show(Number(new URL(location.href).searchParams.get("variant") ?? 0));
    </script>
  </body>
</html>
