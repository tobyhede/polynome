<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A tiny polyrhythm and polymeter metronome with independent left/right balance for each rhythm."
    />
    <meta name="theme-color" content="#f5f4ef" />
    <title>Polynome</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">METRONOME</p>
          <h1>Polynome</h1>
        </div>
      </header>

      <section class="transport" aria-label="Transport and tempo">
        <button
          id="play-button"
          class="play-button"
          type="button"
          aria-pressed="false"
          aria-label="Play metronome"
        >
          <span id="play-icon" class="play-icon" aria-hidden="true">▶</span>
          <span id="play-label">Play</span>
        </button>

        <div class="tempo">
          <div class="tempo-number">
            <button id="bpm-down" class="tempo-nudge" type="button" aria-label="Decrease tempo">−</button>
            <label>
              <span class="sr-only">Tempo in quarter-note beats per minute</span>
              <input id="bpm-input" type="number" min="30" max="300" inputmode="numeric" />
            </label>
            <button id="bpm-up" class="tempo-nudge" type="button" aria-label="Increase tempo">+</button>
          </div>
          <div class="tempo-unit">BPM</div>
          <div class="tempo-slider-wrap">
            <input
              id="bpm-slider"
              class="tempo-slider"
              type="range"
              min="30"
              max="300"
              step="1"
              list="bpm-marks"
              aria-label="Tempo in beats per minute"
            />
            <datalist id="bpm-marks">
              <option value="30"></option>
              <option value="40"></option>
              <option value="50"></option>
              <option value="60"></option>
              <option value="70"></option>
              <option value="80"></option>
              <option value="90"></option>
              <option value="100"></option>
              <option value="110"></option>
              <option value="120"></option>
              <option value="130"></option>
              <option value="140"></option>
              <option value="150"></option>
              <option value="160"></option>
              <option value="170"></option>
              <option value="180"></option>
              <option value="190"></option>
              <option value="200"></option>
              <option value="210"></option>
              <option value="220"></option>
              <option value="230"></option>
              <option value="240"></option>
              <option value="250"></option>
              <option value="260"></option>
              <option value="270"></option>
              <option value="280"></option>
              <option value="290"></option>
              <option value="300"></option>
            </datalist>
            <div class="tempo-scale" aria-hidden="true">
              <span>30</span>
              <span>120</span>
              <span>210</span>
              <span>300</span>
            </div>
          </div>
        </div>

        <label class="master-volume">
          <span>Master</span>
          <input id="master-volume" type="range" min="0" max="1" step="0.01" />
        </label>
      </section>

      <section class="presets" aria-labelledby="preset-heading">
        <h2 id="preset-heading">Presets</h2>
        <div id="preset-list" class="preset-list"></div>
      </section>

      <section class="sequence" aria-labelledby="sequence-heading">
        <div class="section-heading">
          <div>
            <h2 id="sequence-heading">Sequence</h2>
          </div>
          <button id="add-cycle" class="add-button" type="button">+ Add cycle</button>
        </div>
        <p id="sequence-summary" class="sequence-summary"></p>
        <div id="cycles" class="cycle-list"></div>
      </section>

      <footer class="page-footer">
        <p><strong>Space</strong> plays and stops.</p>
        <p id="status" class="status" role="status" aria-live="polite">Stopped</p>
      </footer>
    </main>

    <noscript>This metronome requires JavaScript.</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
