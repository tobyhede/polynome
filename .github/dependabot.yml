version: 2

# Every action in this repository is pinned to a commit SHA, which
# `test/workflow.test.js` enforces. A pin cannot be moved by whoever controls
# the tag, which is the point, but it also cannot pick up a fix on its own: the
# pin that is safe on the day it is written is the pin that is stale a year
# later, and nothing in the repository would say so. Dependabot is the half
# that makes pinning maintainable rather than merely frozen — it rewrites the
# SHA and the version comment together, so the checks keep passing.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  # The application ships no runtime dependencies, so this covers Playwright
  # and esbuild only. Grouped because a lone bump to either is not worth its
  # own pull request and its own full browser test run.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
    groups:
      development:
        dependency-type: development
